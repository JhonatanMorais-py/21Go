services:
  - type: web
    name: 21go-protecao-patrimonial-rj
    runtime: static
    buildCommand: echo "Site estático pronto"
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
